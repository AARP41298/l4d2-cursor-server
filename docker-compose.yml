services:
  l4d2:
    build: ./server
    container_name: l4d2-8plus
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      # Host (Windows) : contenedor (srcds). El cliente L4D2 ya usa 27015;
      # deja ambos en 27016 para que Steam anuncie el mismo puerto.
      - "${DOCKER_EXTERNO:-27016}:${DOCKER_INTERNO:-27016}/udp"
      - "${DOCKER_EXTERNO:-27016}:${DOCKER_INTERNO:-27016}/tcp"
    environment:
      DOCKER_INTERNO: ${DOCKER_INTERNO:-27016}
      SRCDS_HOSTNAME: ${SRCDS_HOSTNAME:-Los 8 de Mercy}
      SRCDS_MAXPLAYERS: ${SRCDS_MAXPLAYERS:-8}
      SRCDS_STARTMAP: ${SRCDS_STARTMAP:-c8m1_apartment}
      SRCDS_GAMEMODE: ${SRCDS_GAMEMODE:-coop}
      SRCDS_REGION: ${SRCDS_REGION:-255}
      SRCDS_RCONPW: ${SRCDS_RCONPW:-cambia-esto}
      SRCDS_PW: ${SRCDS_PW:-}
      SRCDS_STEAMGROUP: ${SRCDS_STEAMGROUP:-0}
      FORCE_ADDON_INSTALL: ${FORCE_ADDON_INSTALL:-0}
      STEAM_USER: ${STEAM_USER:-anonymous}
      STEAM_PASS: ${STEAM_PASS:-}
      STEAM_GUARD: ${STEAM_GUARD:-}
      WORKSHOP_IDS: ${WORKSHOP_IDS:-2233971331}
      FORCE_WORKSHOP_UPDATE: ${FORCE_WORKSHOP_UPDATE:-0}
    volumes:
      - l4d2-game:/home/steam/l4d2
      - ./server/addons-drop:/home/steam/addons-drop:ro
    stop_grace_period: 20s

volumes:
  l4d2-game:
